# ============================================================
# docker-compose.yml — AI 서버 배포
# ============================================================

services:

  # ── AI 서버 (FastAPI) ──────────────────────────────────────
  ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banuzil-ai-server
    ports:
      - "8000:8000"
    volumes:
      # KoELECTRA 모델 가중치 마운트 (필수)
      - ./models:/app/models:ro
      # DSPy 최적화 파일 마운트 (선택)
      - ./dspy_optimized:/app/dspy_optimized:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - banuzil-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/emotion/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  banuzil-net:
    driver: bridge
