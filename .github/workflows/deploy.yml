name: EC2 자동 배포

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: EC2 배포 (최대 3회 재시도)
        run: |
          MAX_ATTEMPTS=3
          WAIT_SECONDS=30

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== 배포 시도 $i/$MAX_ATTEMPTS ==="

            if ssh -i ~/.ssh/deploy_key \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=60 \
                   ubuntu@${{ secrets.EC2_HOST }} \
                   "cd ~/banuzil-ai-server && git pull && sudo docker compose up --build -d"; then
              echo "배포 성공!"
              exit 0
            fi

            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "연결 실패. ${WAIT_SECONDS}초 후 재시도..."
              sleep $WAIT_SECONDS
            fi
          done

          echo "3회 시도 모두 실패"
          exit 1
