name: EC2 자동 배포

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 배포 시도 1
        id: try1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            cd ~/banuzil-ai-server
            git pull
            sudo docker compose up --build -d

      - name: 재시도 대기 (1차 실패 시)
        if: steps.try1.outcome == 'failure'
        run: |
          echo "1차 실패. 30초 후 재시도..."
          sleep 30

      - name: 배포 시도 2
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            cd ~/banuzil-ai-server
            git pull
            sudo docker compose up --build -d

      - name: 재시도 대기 (2차 실패 시)
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: |
          echo "2차 실패. 30초 후 재시도..."
          sleep 30

      - name: 배포 시도 3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            cd ~/banuzil-ai-server
            git pull
            sudo docker compose up --build -d
